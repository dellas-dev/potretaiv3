<!DOCTYPE html>
<html>
<head>
<title>PotretAI Payment Dashboard</title>
<style>
body{font-family:Arial;padding:30px}
.card{border:1px solid #ddd;padding:15px;margin-bottom:15px}
img{max-width:200px}
button{padding:8px 12px;margin-right:5px}
</style>
</head>
<body>

<h2>Payment Verification</h2>

<div id="orders"></div>

<script>

async function loadOrders(){

 const res = await fetch("/admin/orders");
 const data = await res.json();

 const container = document.getElementById("orders");
 container.innerHTML="";

 data.orders.forEach(o=>{

  const div=document.createElement("div");
  div.className="card";

  div.innerHTML=`
  <b>Order:</b> ${o.order_id}<br>
  <b>User:</b> ${o.user_id}<br>
  <b>Plan:</b> ${o.plan}<br>
  <b>Status:</b> ${o.status}<br>
  <img src="/admin/proof/${o.order_id}"><br><br>

  <button onclick="verify('${o.order_id}','approved')">Approve</button>
  <button onclick="verify('${o.order_id}','rejected')">Reject</button>
  `;

  container.appendChild(div);

 });

}

async function verify(id,status){

 await fetch("/verify-payment",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({order_id:id,status})
 });

 loadOrders();
}

loadOrders();

</script>

</body>
</html>
